<style>

.usc-rec-label{font-size:12.5px!important;letter-spacing:.06em!important;text-transform:uppercase!important;color:#2f6df0!important;font-weight:700!important;margin:0 0 4px!important}

.usc-browse:hover{text-decoration:underline!important}

.usc-disclaimer{font-size:12.5px!important;line-height:1.5!important;color:#94a1b5!important;margin:18px 0 0!important;padding-top:14px!important;border-top:1px solid #edf1f7!important}
@media(max-width:600px){.usc-body{padding:8px 20px 28px!important}.usc-q{font-size:19px!important}#usc-cta{padding:28px 20px!important}#usc-cta .usc-cta-title{font-size:22px!important}}
</style>

<script>
(function(){
  var W=document.getElementById('usc-overlay'); if(!W) return;
  var body=document.getElementById('usc-body'), openBtn=document.getElementById('usc-open'), closeBtn=document.getElementById('usc-close');
  var COURSES={
    c1:{t:'AI Literacy for Everyone',u:'/courses/ai-literacy-for-everyday-people/',why:'You reach for AI fast — which is fine, as long as you stay in the driver’s seat. This course teaches you to use AI as a tool for thinking, not a crutch, so you keep your own judgement sharp.',s:'learn to use AI deliberately instead of on autopilot.'},
    c4:{t:'Deep Focus',u:'/courses/deep-focus-reclaiming-attention/',why:'Your attention is stretched thin — not broken. Deep Focus is the applied course on training concentration back, deliberately, in an age built to fragment it.',s:'rebuild the attention span modern life keeps chipping away at.'},
    c2:{t:'Neuroplasticity in Practice',u:'/courses/neuroplasticity-in-practice/',why:'New things aren’t sticking the way you’d like. This course rewires *how* you learn — the science of making knowledge durable — so it actually stays.',s:'make what you learn stick instead of leaking away.'},
    c3:{t:'Brain Health 101',u:'/courses/brain-health-101/',why:'The quiet basics — sleep, stress, movement, nutrition — are running your brain more than any app. Brain Health 101 gets the five everyday levers working for you.',s:'fix the everyday levers (sleep, stress, movement) that decide how well your brain works.'}
  };
  var Q=[
    {q:'When an AI tool gives you an answer, you usually…',o:[['Take it and move on',{c1:3}],['Skim it and assume it’s right',{c1:2}],['Check it against what you already know',{c1:0}]]},
    {q:'Ever asked an AI something, then realised you’d forgotten the answer by the time you finished pasting it?',o:[['All the time',{c1:3}],['Sometimes',{c1:2}],['Rarely',{c1:0}]]},
    {q:'Can you read one full page — a real one — without checking your phone?',o:[['No chance',{c4:3}],['Only if I really force it',{c4:2}],['Usually, yes',{c4:0}]]},
    {q:'By the end of the day, your brain feels…',o:[['Fried, even on days that weren’t hard',{c4:3}],['A bit foggy',{c4:2}],['Mostly clear',{c4:0}]]},
    {q:'Something you genuinely learned last month is now…',o:[['Mostly gone',{c2:3}],['Fuzzy',{c2:2}],['Still solid',{c2:0}]]},
    {q:'When you want to learn something new, you mostly…',o:[['Re-read or re-watch it until it sticks',{c2:3}],['Highlight it and hope',{c2:2}],['Test yourself and put it to use',{c2:0}]]},
    {q:'How many nights a week do you get 7+ hours of sleep?',o:[['0–2',{c3:3}],['3–4',{c3:2}],['5–7',{c3:0}]]},
    {q:'How often does stress make it hard to focus or remember?',o:[['Most days',{c3:3}],['Now and then',{c3:2}],['Rarely',{c3:0}]]}
  ];
  var idx=-1, scores={c1:0,c2:0,c3:0,c4:0}, lastFocus=null;
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function open(){lastFocus=document.activeElement;idx=-1;scores={c1:0,c2:0,c3:0,c4:0};W.hidden=false;document.body.style.overflow='hidden';renderIntro();closeBtn.focus();}
  function close(){W.hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
  function renderIntro(){
    body.innerHTML='<h2 class="usc-intro-title" id="usc-live-title">The 2-Minute Brain + AI Self-Check</h2>'+
    '<p class="usc-intro-sub">Eight quick questions about how AI and modern life are treating your brain. At the end you’ll get one honest, science-based suggestion for where to start — no email, no fear-mongering.</p>'+
    '<button type="button" class="usc-start" id="usc-start">Begin →</button>'+
    '<p class="usc-disclaimer">This is a quick, science-based nudge — not a medical or psychological assessment. If anything here worries you, talk to a qualified professional.</p>';
    document.getElementById('usc-start').addEventListener('click',next);
  }
  function next(){idx++;if(idx>=Q.length){renderResult();return;}renderQ();}
  function renderQ(){
    var q=Q[idx];var pct=Math.round((idx)/Q.length*100);
    var h='<p class="usc-progress">Question '+(idx+1)+' of '+Q.length+'</p>'+
      '<div class="usc-progress-bar"><div class="usc-progress-fill" style="width:'+pct+'%"></div></div>'+
      '<p class="usc-q" id="usc-live-title">'+esc(q.q)+'</p><div class="usc-opts">';
    for(var i=0;i<q.o.length;i++){h+='<button type="button" class="usc-opt" data-i="'+i+'">'+esc(q.o[i][0])+'</button>';}
    h+='</div>';body.innerHTML=h;
    var btns=body.querySelectorAll('.usc-opt');
    for(var j=0;j<btns.length;j++){btns[j].addEventListener('click',function(){var pts=q.o[this.getAttribute('data-i')][1];for(var k in pts){scores[k]+=pts[k];}next();});}
    body.scrollTop=0;
  }
  function ranked(){return Object.keys(scores).sort(function(a,b){return scores[b]-scores[a]||['c1','c4','c2','c3'].indexOf(a)-['c1','c4','c2','c3'].indexOf(b);});}
  function renderResult(){
    var r=ranked();var top=r[0],sec=r[1];var allLow=(scores.c1+scores.c2+scores.c3+scores.c4)<=3;
    var head,sub;
    if(allLow){top='c2';sec='c1';head='Honestly? You’re doing better than most.';sub='Not much is tripping you up right now — which is a great base to build on. If you want to go from "fine" to genuinely sharp, here’s where the science says to aim.';}
    else{head='You’re not broken — and your brain isn’t “getting worse.”';sub='What you’re feeling is a normal response to an overloaded, AI-saturated world. Based on your answers, here’s the highest-leverage place to start.';}
    var c=COURSES[top],c2=COURSES[sec];
    var h='<h2 class="usc-result-head" id="usc-live-title">'+esc(head)+'</h2>'+
      '<p class="usc-result-sub">'+esc(sub)+'</p>'+
      '<div class="usc-rec-card"><p class="usc-rec-label">Start here</p>'+
      '<p class="usc-rec-title">'+esc(c.t)+'</p>'+
      '<p class="usc-rec-why">'+c.why+'</p>'+
      '<a class="usc-enrol" href="'+c.u+'">Enrol now →</a></div>'+
      '<p class="usc-secondary">Also worth a look: <a href="'+c2.u+'">'+esc(c2.t)+'</a> — to '+c2.s+'</p>'+
      '<div class="usc-result-actions"><a class="usc-browse" href="/our-courses/">Browse all courses →</a>'+
      '<button type="button" class="usc-restart" id="usc-restart">Retake the check</button></div>'+
      '<p class="usc-disclaimer">A quick, science-based nudge — not a medical or psychological assessment. Every course is self-paced and grounded in peer-reviewed research.</p>';
    body.innerHTML=h;body.scrollTop=0;
    document.getElementById('usc-restart').addEventListener('click',open);
  }
  openBtn.addEventListener('click',open);
  closeBtn.addEventListener('click',close);
  W.addEventListener('click',function(e){if(e.target===W)close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!W.hidden)close();});
})();
</script>
