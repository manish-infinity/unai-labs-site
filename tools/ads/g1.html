<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
/* R2 Mid-action narration: the invisible gorilla, our own drawn players (not the study footage). Bright court, story already happening at frame 0. */
html,body{background:#f3dfb4}
#bgA{background:linear-gradient(#e9eef5 0%,#e9eef5 30%,#f3dfb4 30%,#e8c98f 100%)}
canvas{position:absolute;inset:0}
.cap{font-size:66px;font-weight:800;text-align:center;width:960px;line-height:1.12;color:#fff;text-shadow:0 0 4px #000,0 4px 0 #000,0 0 22px rgba(0,0,0,.6)}
.cap .hl{color:#ffd166}
.brand{color:#1d2433}.brand span{color:#e2574c}
.foot{color:rgba(29,36,51,.75)}
.big{font-size:240px;font-weight:800;color:#e2574c;letter-spacing:-6px;text-shadow:0 8px 0 rgba(0,0,0,.15)}
</style></head><body>
<div id="stage"><div id="bgA"></div><canvas id="cv" width="1080" height="1920"></canvas><div id="progress"></div></div>
<script src="engine.js"></script><script src="bank.js"></script>
<script>
E.dur = 20;
add('un<span>^</span>AI LABS', 'brand', [[0, { y: -850 }]]);
add('<div class="cap">She walked <span class="hl">right through</span> the game.</div>', '', [[0, { y: 430, o: 1 }], [2.8, {}], [3.0, { o: 0 }]]);
say('Stopped. Thumped her <span class="hl">chest.</span>', 'cap', 0, 430, 3.0, 5.6, 6);
say('On screen for <span class="hl">5 seconds.</span>', 'cap', 0, 430, 5.7, 8.4, 6);
say('Half the people watching <span class="hl">never saw her.</span>', 'cap', 0, 430, 8.5, 11.7, 7);
say('They were busy counting <span class="hl">passes.</span>', 'cap', 0, 430, 11.8, 15.6, 6);
add('<div class="big">1 in 2</div>', '', [[8.7, { y: -420, o: 0, s: .5 }], [9.0, { o: 1, s: 1 }, 'back'], [11.5, {}], [11.7, { o: 0 }]]);
foot('Simons &amp; Chabris 1999, Perception', 5.7, 11.8, 780);
foot('Simons &amp; Chabris 1999, Perception', 11.8, 15.6, 780).style.color = 'rgba(255,255,255,.75)';
payoff(15.8, { kicker: 'THE TAKEAWAY', title: 'You see what you<br>pay attention to.', sub: 'So <b>choose what you<br>pay attention to.</b>', save: 'Tag someone who never notices anything' });
const c = document.getElementById('cv').getContext('2d');
// players: 3 white shirts pass the ball, 3 black shirts weave
const W = [[300, 760], [780, 820], [540, 1140]], B = [[220, 1080], [860, 1120], [520, 700]];
function pos(base, i, t, amp) { return [base[0] + Math.sin(t * 1.3 + i * 2.1) * amp, base[1] + Math.cos(t * 1.1 + i * 1.7) * amp * .6]; }
function person(x, y, shirt, skin, s = 1) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(0, 150, 60, 14, 0, 0, 7); c.fill();
  c.fillStyle = '#2c3446'; c.fillRect(-26, 70, 20, 78); c.fillRect(6, 70, 20, 78);
  c.fillStyle = shirt; c.strokeStyle = '#1d2433'; c.lineWidth = 4; c.beginPath(); c.roundRect(-40, -10, 80, 90, 22); c.fill(); c.stroke();
  c.fillStyle = skin; c.beginPath(); c.arc(0, -42, 32, 0, 7); c.fill(); c.stroke();
  c.restore();
}
function gorilla(x, y, t, thump) {
  c.save(); c.translate(x, y);
  const sw = Math.sin(t * 6) * 8;
  c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(0, 175, 90, 18, 0, 0, 7); c.fill();
  c.fillStyle = '#2b2522'; c.strokeStyle = '#111'; c.lineWidth = 4;
  c.beginPath(); c.roundRect(-38, 90, 30, 85, 14); c.fill(); c.beginPath(); c.roundRect(8, 90, 30, 85, 14); c.fill();
  c.beginPath(); c.ellipse(0, 40, 72, 85, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#5a4a42'; c.beginPath(); c.ellipse(0, 50, 40, 50, 0, 0, 7); c.fill();
  // arms: swinging while walking, beating the chest while thumping
  c.strokeStyle = '#2b2522'; c.lineWidth = 34; c.lineCap = 'round';
  if (thump) { const k = Math.abs(Math.sin(t * 10)); c.beginPath(); c.moveTo(-60, 0); c.lineTo(-20 + k * 10, 40); c.stroke(); c.beginPath(); c.moveTo(60, 0); c.lineTo(20 - k * 10, 40 - k * 10); c.stroke(); }
  else { c.beginPath(); c.moveTo(-62, 0); c.lineTo(-80, 100 + sw); c.stroke(); c.beginPath(); c.moveTo(62, 0); c.lineTo(80, 100 - sw); c.stroke(); }
  c.fillStyle = '#2b2522'; c.strokeStyle = '#111'; c.lineWidth = 4; c.beginPath(); c.arc(0, -60, 44, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#6b5a50'; c.beginPath(); c.ellipse(0, -50, 28, 22, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(-14, -70, 6, 0, 7); c.arc(14, -70, 6, 0, 7); c.fill();
  c.restore();
}
window.bg = t => {
  c.clearRect(0, 0, 1080, 1920);
  // court lines
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 8; c.beginPath(); c.arc(540, 1700, 300, Math.PI, 0); c.stroke(); c.beginPath(); c.moveTo(0, 1400); c.lineTo(1080, 1400); c.stroke();
  const spot = t > 11.8 && t < 15.7 ? eo((t - 11.8) / .6) * (t > 15.4 ? 1 - (t - 15.4) / .3 : 1) : 0;
  const wp = W.map((b, i) => pos(b, i, t, 40)), bp = B.map((b, i) => pos(b, i + 3, t, 55));
  bp.forEach(p => person(p[0], p[1], '#1d2433', '#c98d63'));
  wp.forEach(p => person(p[0], p[1], '#ffffff', '#f0c29b'));
  // gorilla path: enters right, stops centre and thumps (3.0-5.6), leaves left (frame 0 she is already walking)
  let gx; if (t < 3) gx = 880 - 340 * t / 3; else if (t < 5.6) gx = 540; else gx = 540 - 760 * (t - 5.6) / 3;
  if (gx > -200) gorilla(gx, 930, t, t >= 3 && t < 5.6);
  // ball passes among white team every 0.9 s
  const seg = Math.floor(t / 0.9), k = (t % 0.9) / 0.9, a = wp[seg % 3], b = wp[(seg + 1) % 3];
  const bx = a[0] + (b[0] - a[0]) * k, by = a[1] + (b[1] - a[1]) * k - Math.sin(k * Math.PI) * 120;
  c.fillStyle = '#e8792b'; c.strokeStyle = '#1d2433'; c.lineWidth = 4; c.beginPath(); c.arc(bx, by, 26, 0, 7); c.fill(); c.stroke();
  // spotlight: attention is a spotlight, not a floodlight
  if (spot > 0) { c.save(); c.fillStyle = 'rgba(10,12,20,' + .78 * spot + ')'; c.beginPath(); c.rect(0, 0, 1080, 1920); c.moveTo(bx + 170, by); c.arc(bx, by, 170, 0, Math.PI * 2); c.fill('evenodd'); c.restore(); }
};
render(0);
</script></body></html>
