<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">

canvas{position:absolute;inset:0;image-rendering:pixelated}

.bar{width:880px;height:110px;border:10px solid #fff;padding:10px;box-shadow:8px 8px 0 #444}
.fill{height:100%;background:repeating-linear-gradient(90deg,#7CFC9A 0 50px,#4fd36b 50px 60px);width:0}
.pct{font:800 150px P;color:#fff;text-shadow:8px 8px 0 #ff3b47;letter-spacing:4px}
.step{font:800 58px/1.15 P;color:#fff;background:#1d1d3a;border:8px solid #7CFC9A;padding:22px 30px;width:900px;text-align:left;box-shadow:10px 10px 0 #000}

</style></head><body>

E.dur = 16;
add('un<span>^</span>AI LABS', 'brand', [[0, { y: -850 }]]);
pop('LOADING:<br>DEEP FOCUS', 'px t l', 0, -600, 0, 10.4, 'zoom');

const P = add('<span class="pct">0%</span>', '', [[0.1, { y: -40, o: 0 }], [0.4, { o: 1 }], [10.2, {}], [10.5, { o: 0 }]]);
const steps = [

];
steps.forEach(([t0, s], i) => add(`<div class="step">${s}</div>`, '', [[t0, { y: 260 + i * 0 + 0, x: -40, o: 0 }], [t0 + 0.25, { x: 0, o: 1 }, 'back'], [t0 + 2.1, {}], [t0 + 2.3, { o: 0, x: 40 }]]));

const c = document.getElementById('cv').getContext('2d');
const stars = Array.from({ length: 70 }, (_, i) => [(i * 97) % 270, (i * 53) % 480, (i % 3) + 1]);
window.bg = t => {
  const pct = Math.min(100, Math.floor(eo(cl((t - 0.4) / 9.6)) * 100 / 25) * 25 + (t > 0.4 ? Math.floor(((t * 7) % 1) * 3) : 0));
  const real = t < 0.4 ? 0 : t > 10 ? 100 : [0, 25, 50, 75, 100][Math.min(4, Math.floor((t - 0.4) / 2.3) + (t > 9.6 ? 1 : 0))];
  fill.style.width = real + '%'; P.querySelector('.pct').textContent = real + '%';
  c.fillStyle = '#0b0b1a'; c.fillRect(0, 0, 270, 480);

  for (let x = 0; x < 270; x += 6) { c.fillStyle = (x / 6) % 2 ? '#1d6b33' : '#25883f'; c.fillRect(x, 440, 6, 40); }
};
render(0);
