<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
/* R1/R4 Your Brain Test #1: Stroop. Dark calm background, one glowing word, timer bar. */
html,body{background:#121628}
#bgA{background:radial-gradient(1100px 1500px at 50% 42%,#1e2542 0%,#121628 60%,#0a0d1a 100%)}
.word{font-size:230px;font-weight:800;letter-spacing:-4px;line-height:1;text-shadow:0 0 40px currentColor}
.cap{font-size:68px;font-weight:800;text-align:center;width:960px;line-height:1.12;text-shadow:0 4px 0 #000,0 0 18px rgba(0,0,0,.8)}
.cap .hl{color:#ffd166}
.rnd{font-size:40px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:4px}
.bar{width:800px;height:16px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#ffd166;transform-origin:left}
.say{font-size:64px;font-weight:800}
</style></head><body>
<div id="stage"><div id="bgA"></div><div id="progress"></div></div>
<script src="engine.js"></script><script src="bank.js"></script>
<script>
E.dur = 20;
add('un<span>^</span>AI LABS', 'brand', [[0, { y: -850 }]]);
add('<div class="pill">YOUR BRAIN TEST #1</div>', '', [[0, { y: -700, o: 1 }], [15.6, {}], [15.8, { o: 0 }]]);
const C = { RED: '#ff4d5a', BLUE: '#4d8dff', GREEN: '#3ddc84', YELLOW: '#ffd23f' };
// frame 0: the premise (RED in blue ink), already moving
add('<div class="word" style="color:' + C.BLUE + '">RED</div>', '', [[0, { y: -120, s: .92, o: 1 }], [1.3, { s: 1.08 }, 'lin'], [1.45, { o: 0, s: .9 }]]);
add('<div class="cap">Say the <span class="hl">colour.</span></div>', '', [[0, { y: 430, o: 1 }], [1.3, {}], [1.45, { o: 0 }]]);
// round 1: congruent (easy)
const r1 = [['RED', 'RED'], ['BLUE', 'BLUE'], ['GREEN', 'GREEN'], ['YELLOW', 'YELLOW'], ['BLUE', 'BLUE']];
// round 2: incongruent (word, ink)
const r2 = [['GREEN', 'RED'], ['RED', 'YELLOW'], ['YELLOW', 'BLUE'], ['BLUE', 'GREEN'], ['RED', 'BLUE'], ['GREEN', 'YELLOW']];
function round(list, t0, step, label) {
  add('<div class="rnd">' + label + '</div>', '', [[t0 - .1, { y: -460, o: 0 }], [t0 + .15, { o: 1 }], [t0 + list.length * step - .1, {}], [t0 + list.length * step + .1, { o: 0 }]]);
  const bar = add('<div class="bar"><i></i></div>', '', [[t0 - .1, { y: 180, o: 0 }], [t0 + .1, { o: 1 }], [t0 + list.length * step, {}], [t0 + list.length * step + .15, { o: 0 }]]);
  const iEl = bar.querySelector('i'), T1 = t0 + list.length * step;
  E.hooks.push(t => { iEl.style.transform = 'scaleX(' + cl(1 - (t - t0) / (T1 - t0)) + ')'; });
  list.forEach(([w, ink], i) => { const a = t0 + i * step; add('<div class="word" style="color:' + C[ink] + '">' + w + '</div>', '', [[a, { y: -120, s: .75, o: 0 }], [a + .12, { s: 1, o: 1 }, 'back'], [a + step - .08, { s: 1 }], [a + step, { o: 0, s: .92 }]]); });
}
round(r1, 1.5, 0.6, 'ROUND 1');
say('Not the word. <span class="hl">Go.</span>', 'cap', 0, 430, 1.5, 4.5, 6);
round(r2, 4.7, 0.7, 'ROUND 2');
say('Now say the <span class="hl">ink.</span>', 'cap', 0, 430, 4.7, 8.9, 6);
// explain
say('Slower on <span class="hl">round 2?</span>', 'cap', 0, -300, 9.1, 11.4, 6);
add('<div class="word" style="color:' + C.BLUE + ';font-size:200px">RED</div>', '', [[9.1, { y: 60, o: 0, s: .8 }], [9.4, { o: 1, s: 1 }, 'back'], [15.4, {}], [15.6, { o: 0 }]]);
add('<div class="say" style="color:#ff4d5a;text-decoration:line-through">"red"</div>', '', [[10.0, { x: -230, y: 330, o: 0 }], [10.3, { o: 1 }], [15.4, {}], [15.6, { o: 0 }]]);
add('<div class="say" style="color:#4d8dff">"blue" &#10003;</div>', '', [[10.7, { x: 230, y: 330, o: 0, s: .7 }], [11.0, { o: 1, s: 1 }, 'back'], [15.4, {}], [15.6, { o: 0 }]]);
say('Reading is <span class="hl">automatic.</span> Your brain has to hit the <span class="hl">brakes.</span>', 'cap', 0, -320, 11.5, 15.6, 7);
foot('Stroop 1935, J. Exp. Psychology; MacLeod 1991 review', 9.1, 15.6, 760);
payoff(15.8, { kicker: 'THE TAKEAWAY', title: 'Focus is a skill.', sub: 'That braking is attention control,<br>and it <b>gets better with practice.</b>', save: 'Comment your round 2 score' });
render(0);
</script></body></html>
